<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indian Banking FAQ Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: #1e40af;
            color: white;
            padding: 24px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-area {
            padding: 30px;
            min-height: 400px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        #question {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        #question:focus {
            border-color: #1e40af;
        }

        button {
            background: #1e40af;
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1e3a8a;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 5px solid #1e40af;
        }

        .result .score {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .result .matched-q {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .result .answer {
            color: #334155;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Indian Banking FAQ Bot</h1>
            <p>Ask any question related to banking in India</p>
        </div>

        <div class="chat-area">
            <div class="input-area">
                <input type="text" id="question" placeholder="e.g. What is UPI?" autocomplete="off" />
                <button onclick="askQuestion()" id="askBtn">Ask</button>
            </div>

            <div id="results"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/ask";   // Change this later when you deploy

        // Allow pressing Enter to ask
        document.getElementById("question").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                askQuestion();
            }
        });

        async function askQuestion() {
            const questionInput = document.getElementById("question");
            const resultsDiv = document.getElementById("results");
            const askBtn = document.getElementById("askBtn");

            const question = questionInput.value.trim();
            if (!question) {
                alert("Please type a question");
                return;
            }

            // Show loading
            resultsDiv.innerHTML = `<div class="loading">Searching...</div>`;
            askBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?q=${encodeURIComponent(question)}`);

                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                const data = await response.json();

                // Clear previous results
                resultsDiv.innerHTML = "";

                if (data.matches && data.matches.length > 0) {
                    data.matches.forEach((match, index) => {
                        const resultHTML = `
              <div class="result">
                <div class="score">Match ${index + 1} • Score: ${match.score}</div>
                <div class="matched-q">${match.matched_question}</div>
                <div class="answer">${match.answer}</div>
              </div>
            `;
                        resultsDiv.innerHTML += resultHTML;
                    });
                } else {
                    resultsDiv.innerHTML = `<div class="error">No matching answers found.</div>`;
                }

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `
          <div class="error">
            Failed to connect to the server.<br>
            Make sure the backend is running on port 8000.
          </div>
        `;
            } finally {
                askBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
